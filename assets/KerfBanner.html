<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0E0517; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: #1E082E; border-bottom: 1px solid #0A717B; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; color: #FFFFFF; }
    .brand-badge { background: #0A717B; color: #46EFB1; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .viewport { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: #08020D; overflow: hidden; }
    canvas { box-shadow: 0 12px 48px rgba(0,0,0,0.6); border-radius: 8px; max-width: 95%; max-height: 90%; image-rendering: -webkit-optimize-contrast; }
    .controls-dock { background: #140720; border-top: 1px solid #0C4247; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; }
    .transport-btns { display: flex; align-items: center; gap: 10px; }
    button.btn { background: #0C4247; color: #FFFFFF; border: 1px solid #0A717B; border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 6px; }
    button.btn:hover { background: #0A717B; border-color: #46EFB1; }
    button.btn-primary { background: #46EFB1; color: #0C4247; border: 1px solid #46EFB1; font-weight: 600; }
    button.btn-primary:hover { background: #38C793; }
    .timeline-scrubber { flex: 1; display: flex; align-items: center; gap: 12px; max-width: 600px; }
    .scrub-track { flex: 1; height: 6px; background: #0C4247; border-radius: 3px; position: relative; cursor: pointer; }
    .scrub-fill { height: 100%; background: #46EFB1; border-radius: 3px; width: 0%; pointer-events: none; }
    .time-label { font-size: 12px; font-family: 'Consolas', monospace; color: #A799B7; min-width: 80px; text-align: center; }
    .state-badge { font-size: 12px; background: #0C4247; border: 1px solid #0A717B; color: #46EFB1; padding: 4px 10px; border-radius: 12px; }
    .inputs-dock { display: flex; align-items: center; gap: 12px; }
    .input-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #E0D7EC; }
  </style>

        ctx.save();
        const layerPose = pose[layer.Id] || pose[layer.NumericId] || {};
        const tx = layerPose[0] !== undefined ? (layerPose[0] - layer.X) : 0;
        const ty = layerPose[1] !== undefined ? (layerPose[1] - layer.Y) : 0;
        const sx = layerPose[2] !== undefined ? layerPose[2] : 1;
        const sy = layerPose[3] !== undefined ? layerPose[3] : 1;
        const rot = layerPose[4] !== undefined ? (layerPose[4] * Math.PI / 180) : 0;
        const op = layerPose[7] !== undefined ? layerPose[7] : (layer.Opacity !== undefined ? layer.Opacity : 1);
        ctx.globalAlpha = Math.max(0, Math.min(1, op));
        const cx = layer.X + (layer.Width || 0) * 0.5;
        const cy = layer.Y + (layer.Height || 0) * 0.5;
        ctx.translate(cx + tx, cy + ty);
        ctx.rotate(rot);
        ctx.scale(sx, sy);
        ctx.translate(-cx, -cy);
        if (layer.Fills && layer.Fills.length > 0 && layer.Fills[0].Color) {
          ctx.fillStyle = layer.Fills[0].Color;
        } else { ctx.fillStyle = '#46EFB1'; }
        const r = layer.CornerRadius || 0;
        if (r > 0) {
          ctx.beginPath();
          ctx.roundRect(layer.X, layer.Y, layer.Width || 100, layer.Height || 100, r);
          ctx.fill();
        } else {
          ctx.fillRect(layer.X, layer.Y, layer.Width || 100, layer.Height || 100);
        }
        ctx.restore();
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);
  </script>
